name: Update Homebrew Packages

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Update versions and checksums
        run: node scripts/update-casks.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit updates
        run: |
          if git diff --quiet -- Casks; then
            echo "Homebrew packages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "chore: update Homebrew packages"
          git push
