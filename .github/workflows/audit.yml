name: Audit Homebrew Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v6

      - name: Register local tap
        run: brew tap aopv/tap "$GITHUB_WORKSPACE"

      - name: Check cask style
        run: brew style --cask aopv/tap/tethershot aopv/tap/browser-cookie-bridge

      - name: Audit casks
        run: brew audit --strict --online --cask aopv/tap/tethershot aopv/tap/browser-cookie-bridge

      - name: Check latest releases
        run: brew livecheck --cask aopv/tap/tethershot aopv/tap/browser-cookie-bridge
