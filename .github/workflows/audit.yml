name: Audit Homebrew Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v6

      - name: Register local tap
        run: brew tap apoorvdarshan/tap "$GITHUB_WORKSPACE"

      # Homebrew refuses to load casks from a third-party tap until it is trusted.
      - name: Trust local tap
        run: brew trust apoorvdarshan/tap

      - name: Check cask style
        run: brew style --cask apoorvdarshan/tap/coincide apoorvdarshan/tap/tethershot apoorvdarshan/tap/browser-cookie-bridge

      # Offline until Coincide's first release exists; then move it to the online audit and livecheck below.
      - name: Audit the Coincide cask
        run: brew audit --strict --cask apoorvdarshan/tap/coincide

      - name: Audit casks
        run: brew audit --strict --online --cask apoorvdarshan/tap/tethershot apoorvdarshan/tap/browser-cookie-bridge

      - name: Check latest releases
        run: brew livecheck --cask apoorvdarshan/tap/tethershot apoorvdarshan/tap/browser-cookie-bridge
